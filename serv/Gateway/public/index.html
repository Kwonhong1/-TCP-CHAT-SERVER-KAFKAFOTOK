<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat Server</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div id="app">

    <!-- ============================================= -->
    <!-- Connection Status -->
    <!-- ============================================= -->

    <header class="top-bar">
        <h1>Chat Server</h1>

        <div id="connection-status" class="status disconnected">
            Gateway 연결 중...
        </div>
    </header>


    <!-- ============================================= -->
    <!-- Auth -->
    <!-- ============================================= -->

    <main id="auth-view" class="view active">
        <section class="panel auth-panel">

            <h2>로그인</h2>

            <input
                id="login-username"
                type="text"
                placeholder="Username"
            >

            <input
                id="login-password"
                type="password"
                placeholder="Password"
            >

            <button id="login-button">
                로그인
            </button>

            <hr>

            <h2>회원가입</h2>

            <input
                id="register-username"
                type="text"
                placeholder="Username"
            >

            <input
                id="register-password"
                type="password"
                placeholder="Password"
            >

            <button id="register-button">
                회원가입
            </button>

            <p id="auth-message"></p>

        </section>
    </main>


    <!-- ============================================= -->
    <!-- Lobby -->
    <!-- ============================================= -->

    <main id="lobby-view" class="view">

        <section class="panel lobby-panel">

            <div class="panel-header">
                <div>
                    <h2>방 목록</h2>
                    <span id="user-info"></span>
                </div>

                <button id="refresh-rooms-button">
                    새로고침
                </button>
            </div>

            <div id="room-list"></div>

        </section>


        <section class="panel create-room-panel">

            <h2>방 만들기</h2>

            <input
                id="room-name"
                type="text"
                placeholder="방 이름"
            >

            <input
                id="room-max-users"
                type="number"
                value="10"
                min="2"
            >

            <button id="create-room-button">
                방 생성
            </button>

            <p id="lobby-message"></p>

        </section>

    </main>


    <!-- ============================================= -->
    <!-- Chat Room -->
    <!-- ============================================= -->

    <main id="chat-view" class="view">

        <section class="panel chat-panel">

            <div class="chat-header">
                <div>
                    <h2 id="chat-room-title">
                        Chat Room
                    </h2>

                    <span id="room-info"></span>
                </div>

                <button id="leave-room-button">
                    방 나가기
                </button>
            </div>


            <button
                id="load-history-button"
                class="secondary-button"
            >
                이전 메시지 불러오기
            </button>


            <div id="chat-messages"></div>


            <div class="chat-input">

                <input
                    id="chat-message-input"
                    type="text"
                    placeholder="메시지를 입력하세요"
                >

                <button id="send-chat-button">
                    전송
                </button>

            </div>

        </section>


        <!-- ========================================= -->
        <!-- Whisper -->
        <!-- ========================================= -->

        <aside class="side-panel">

            <section class="panel">

                <h3>귓속말</h3>

                <input
                    id="whisper-target"
                    type="text"
                    placeholder="상대 Username"
                >

                <input
                    id="whisper-message"
                    type="text"
                    placeholder="메시지"
                >

                <button id="whisper-button">
                    보내기
                </button>

            </section>


            <!-- ===================================== -->
            <!-- Admin -->
            <!-- ===================================== -->

            <section class="panel">

                <h3>방 관리</h3>

                <input
                    id="kick-user-id"
                    type="number"
                    placeholder="강퇴할 User ID"
                >

                <button id="kick-user-button">
                    강퇴
                </button>

                <input
                    id="master-user-id"
                    type="number"
                    placeholder="새 방장 User ID"
                >

                <button id="transfer-master-button">
                    방장 위임
                </button>

            </section>


            <section class="panel">

                <h3>알림</h3>

                <div id="notifications"></div>

            </section>

        </aside>

    </main>

</div>

<script type="module" src="/js/app.js"></script>

</body>
</html>
