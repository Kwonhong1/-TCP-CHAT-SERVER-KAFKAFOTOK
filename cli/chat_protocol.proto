syntax = "proto3";

package chat;

// --- 공통 데이터 구조 ---

message RoomInfo {
    uint32 room_id = 1;
    string room_name = 2;
    uint32 current_users = 3;
    uint32 max_users = 4;
    uint32 owner_id = 5;
}

// --- 로그인 / 회원가입 ---

message LoginRequest {
    string username = 1;
    string password = 2;
    string reconnect_token = 3;
}

message LoginResponse {
    bool success = 1;
    uint32 assigned_user_id = 2;
    string reconnect_token = 3;
    string error_message = 4;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
}

message RegisterResponse {
    bool success = 1;
    uint32 assigned_user_id = 2;
    string error_message = 3;
}

// --- 채팅 및 알림 ---

message ChatMessage {
    uint32 room_id = 1;
    string message = 2;
    uint32 sender_id = 3;
    string sender_username = 4; // 추가: 화면 표시용 보낸 사람 이름
    int64 timestamp = 5; // 추가: 메시지 시각 (Unix timestamp)
    uint64 message_id = 6; // 추가: 메시지 고유 ID (페이징용 커서)
}

message ServerNotification {
    string message = 1;
}

// --- 방 관리 ---

message CreateRoomRequest {
    string room_name = 1;
    uint32 max_users = 2;
}

message CreateRoomResponse {
    bool success = 1;
    uint32 created_room_id = 2;
    uint32 owner_id = 3;
    string error_message = 4;
}

message RoomListRequest {}

message RoomListResponse {
    repeated RoomInfo rooms = 1;
}

message JoinRoomRequest {
    uint32 room_id = 1;
}

message JoinRoomResponse {
    bool success = 1;
    uint32 room_id = 2;
    uint32 owner_id = 3;
    string error_message = 4;
    repeated ChatMessage recent_messages = 5; // 추가: 방 진입 시 자동 수신할 최근 대화 목록
}

message LeaveRoomRequest {
    uint32 room_id = 1;
}

message LeaveRoomResponse {
    bool success = 1;
    string error_message = 2;
}

// --- 채팅 히스토리 (새로 추가) ---

message ChatHistoryRequest {
    uint32 room_id = 1;
    uint64 last_message_id = 2; // 커서 (0이면 최신부터, 특정 ID 입력 시 그 이전 대화)
    uint32 count = 3; // 불러올 개수 (예: 20개)
}

message ChatHistoryResponse {
    bool success = 1;
    uint32 room_id = 2;
    repeated ChatMessage messages = 3; // 과거 대화 목록
    bool has_more = 4; // 더 이전 대화가 남아있는지 여부
    string error_message = 5;
}

// --- 귓속말 ---

message WhisperRequest {
    uint32 room_id = 1;
    string target_username = 2;
    string message = 3;
}

message WhisperResponse {
    bool success = 1;
    string error_message = 2;
}

message WhisperNotification {
    string sender_username = 1;
    string message = 2;
}

// --- 강퇴 및 방장 위임 ---

message KickUserRequest {
    uint32 room_id = 1;
    uint32 target_user_id = 2;
}

message KickUserResponse {
    bool success = 1;
    string error_message = 2;
}

message KickedNotification {
    uint32 room_id = 1;
    string reason = 2;
}

message TransferMasterRequest {
    uint32 room_id = 1;
    uint32 new_master_id = 2;
}

message TransferMasterResponse {
    bool success = 1;
    string error_message = 2;
}

message MasterChangedNotification {
    uint32 room_id = 1;
    uint32 new_master_id = 2;
}

