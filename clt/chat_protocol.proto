syntax = "proto3";
package chat;
option go_package = "./;main";
// --- 공 통  데 이 터  구 조  ---
message RoomInfo {
    uint32 room_id = 1;
    string room_name = 2;
    uint32 current_users = 3;
    uint32 max_users = 4;
    uint32 owner_id = 5;
}
// --- 로 그 인  / 회 원 가 입  ---
message LoginRequest {
    string username = 1;
    string password = 2;
    string reconnect_token = 3;
}
message LoginResponse {
    bool success = 1;
    uint32 assigned_user_id = 2;
    string reconnect_token = 3;
    string error_message = 4;
}
message RegisterRequest {
    string username = 1;
    string password = 2;
}
message RegisterResponse {
    bool success = 1;
    uint32 assigned_user_id = 2;
    string error_message = 3;
}
// --- 채 팅  및  알 림  ---
message ChatMessage {
    uint32 room_id = 1;
    string message = 2;
    uint32 sender_id = 3;
    string sender_username = 4; // 추 가 : 화 면  표 시 용  보 낸  사 람  이 름
    int64 timestamp = 5; // 추 가 : 메 시 지  시 각  (Unix timestamp)
    uint64 message_id = 6; // 추 가 : 메 시 지  고 유  ID (페 이 징 용  커 서 )
}
message ServerNotification {
    string message = 1;
}
// --- 방  관 리  ---
message CreateRoomRequest {
    string room_name = 1;
    uint32 max_users = 2;
}
message CreateRoomResponse {
    bool success = 1;
    uint32 created_room_id = 2;
    uint32 owner_id = 3;
    string error_message = 4;
}
message RoomListRequest {}
message RoomListResponse {
    repeated RoomInfo rooms = 1;
}
message JoinRoomRequest {
    uint32 room_id = 1;
}
message JoinRoomResponse {
    bool success = 1;
    uint32 room_id = 2;
    uint32 owner_id = 3;
    string error_message = 4;
    repeated ChatMessage recent_messages = 5; // 추 가 : 방  진 입  시  자 동  수 신 할  최 근  대 화  목 록
}
message LeaveRoomRequest {
    uint32 room_id = 1;
}
message LeaveRoomResponse {
    bool success = 1;
    string error_message = 2;
}
// --- 채 팅  히 스 토 리  (새 로  추 가 ) ---
message ChatHistoryRequest {
    uint32 room_id = 1;
    uint64 last_message_id = 2; // 커 서  (0이 면  최 신 부 터 , 특 정  ID 입 력  시  그  이 전  대 화 )
    uint32 count = 3; // 불 러 올  개 수  (예 : 20개 )
}
message ChatHistoryResponse {
    bool success = 1;
    uint32 room_id = 2;
    repeated ChatMessage messages = 3; // 과 거  대 화  목 록
    bool has_more = 4; // 더  이 전  대 화 가  남 아 있 는 지  여 부
    string error_message = 5;
}
// --- 귓 속 말  ---
message WhisperRequest {
    uint32 room_id = 1;
    string target_username = 2;
    string message = 3;
}
message WhisperResponse {
    bool success = 1;
    string error_message = 2;
}
message WhisperNotification {
    string sender_username = 1;
    string message = 2;
}
// --- 강 퇴  및  방 장  위 임  ---
message KickUserRequest {
    uint32 room_id = 1;
    uint32 target_user_id = 2;
}
message KickUserResponse {
    bool success = 1;
    string error_message = 2;
}
message KickedNotification {
    uint32 room_id = 1;
    string reason = 2;
}
message TransferMasterRequest {
    uint32 room_id = 1;
    uint32 new_master_id = 2;
}
message TransferMasterResponse {
    bool success = 1;
    string error_message = 2;
}
message MasterChangedNotification {
    uint32 room_id = 1;
    uint32 new_master_id = 2;
}